<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriQueue AI - Smart Kisan Mandi Arrival Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Nunito+Sans:ital,opsz,wght@0,6..12,300;0,6..12,400;0,6..12,500;0,6..12,600;0,6..12,700;1,6..12,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface": "#faf7f2",
              "background": "#faf7f2",
              "surface-low": "#f4efe6",
              "surface-card": "#ffffff",
              "primary": "#4a7c59",
              "primary-dark": "#365c41",
              "primary-deep": "#1f3b28",
              "primary-light": "#eaf3ec",
              "secondary": "#636d65",
              "on-surface": "#232b25",
              "on-surface-subtle": "#667067",
              "accent": "#b8702c",
              "accent-soft": "#fbf4eb",
              "border-subtle": "#e6e0d4",
              "border-light": "#ede8de"
            },
            borderRadius: {
              "DEFAULT": "0.5rem",
              "lg": "1rem",
              "xl": "1.25rem",
              "2xl": "1.5rem",
              "3xl": "2rem",
              "full": "9999px"
            },
            fontFamily: {
              headline: ['"Literata"', 'serif'],
              display: ['"Literata"', 'serif'],
              body: ['"Nunito Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <!-- Hidden container for Google Translate Widget -->
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'hi,pa,mr,gu,bn,te,ta,en',
            autoDisplay: false
          }, 'google_translate_element');
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
